name: Build Windows wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Windows cp${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build wheel
        run: maturin build --release --out dist -i python

      - name: Smoke test
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m pip install --no-deps $wheel.FullName
          python -c "import mouc.rust; print('mouc.rust import OK')"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel-cp${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
